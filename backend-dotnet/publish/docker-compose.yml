services:
  postgres:
    container_name: canvas-dotnet-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-open_ai_canvas}
      POSTGRES_USER: ${POSTGRES_USER:-open_ai_canvas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    container_name: canvas-dotnet-redis
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    container_name: canvas-dotnet-backend
    image: open-ai-canvas-backend-dotnet:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CANVAS_BACKEND_ADDR: ":8080"
      CANVAS_BACKEND_DATA_DIR: /data
      CANVAS_AUTO_MIGRATE: "true"
      CANVAS_DATABASE_DRIVER: postgres
      DATABASE_URL: Host=postgres;Port=5432;Database=${POSTGRES_DB:-open_ai_canvas};Username=${POSTGRES_USER:-open_ai_canvas};Password=${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      CANVAS_CORS_ORIGINS: "*"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    container_name: canvas-dotnet-web
    image: open-ai-canvas-web:local
    build:
      context: ../../
      dockerfile: Dockerfile
    ports:
      - "5173:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
